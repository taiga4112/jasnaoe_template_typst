abstract:
  ja: "このテンプレートは、2024年秋季講演会以降の日本船舶海洋工学会の講演会論文作成を想定して、Typstで作成しています。もちろん♡非公式♡のテンプレートですので、ご使用の際は自己責任でお願いします。"
  en: "This template is designed for writing conference papers for the Japan Society of Naval Architects and Ocean Engineers (JASNAOE) from the 2024 Autumn Meeting onwards, created using Typst. Of course, this is an unofficial template, so please use it at your own risk."

